version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: clipmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: clipmind_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  mongodb:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-clipmind}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clipmind_db}
      - MONGO_URL=mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD}@mongodb:27017/
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    depends_on:
      - postgres
      - mongodb
    volumes:
      - ./backend:/app
    restart: always

volumes:
  postgres_data:
  mongodb_data:

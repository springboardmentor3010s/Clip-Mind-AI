services:
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: clipmind-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/transcripts:/app/transcripts
      - ./backend/summaries:/app/summaries
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    container_name: clipmind-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
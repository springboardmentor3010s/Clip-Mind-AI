# ClipMind AI — full stack.
#
#   db       PostgreSQL 16
#   redis    Redis 7 (Celery broker + Django cache)
#   backend  Django/DRF via Gunicorn (runs migrations)
#   worker   Celery worker (AI pipeline: FFmpeg, Whisper, LLM)
#   frontend React SPA built by Vite, served by nginx
#
# Usage:  docker compose up -d --build
# The frontend build context is the sibling frontend repository.

services:
  db:
    image: postgres:16-alpine
    container_name: clipmind_db
    environment:
      POSTGRES_DB: ${DB_NAME:-clipmind_ai}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_EXPOSED_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-clipmind_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: clipmind_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_EXPOSED_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clipmind_backend
    # Only the web container migrates, so the worker never races it.
    environment: &backend_env
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-insecure-dev-key-change-me}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,0.0.0.0}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      DB_NAME: ${DB_NAME:-clipmind_ai}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@clipmind.ai}
      RUN_MIGRATIONS: "true"
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      DJANGO_SUPERUSER_FIRSTNAME: ${DJANGO_SUPERUSER_FIRSTNAME:-Admin}
    volumes:
      - media_data:/app/media
      - logs_data:/app/logs
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clipmind_worker
    environment:
      <<: *backend_env
      # The worker must NOT migrate — the backend container owns that.
      RUN_MIGRATIONS: "false"
      DJANGO_SUPERUSER_EMAIL: ""
      DJANGO_SUPERUSER_PASSWORD: ""
    # Shares the media volume so it can read uploads and write thumbnails.
    volumes:
      - media_data:/app/media
      - logs_data:/app/logs
    command: celery -A config worker --loglevel=info --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../clip_mind_AI
      dockerfile: Dockerfile
      args:
        # Baked in at build time — Vite inlines env vars into the bundle.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
    container_name: clipmind_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_data:
  logs_data:

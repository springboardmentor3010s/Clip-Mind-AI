server {
    listen 80;
    # Also bind IPv6 — inside the container `localhost` resolves to ::1 first,
    # so an IPv4-only listener makes health probes fail with "connection refused".
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads can be large; nginx only serves the SPA here, but keep the limit
    # generous in case the API is proxied through this server in future.
    client_max_body_size 2048M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable — cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback. Client-side routes such as /shared/<token> and
    # /dashboard must return index.html so a hard refresh does not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or clients keep booting an old
    # bundle after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

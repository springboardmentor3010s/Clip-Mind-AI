<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClipMind AI | Login</title>

    <!-- Global CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">

    <!-- Login CSS -->
    <link rel="stylesheet" href="../assets/css/login.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- Floating Background -->
    <div class="floating box1"></div>
    <div class="floating box2"></div>
    <div class="floating box3"></div>

    <div class="login-container">

        <!-- Left Side -->
        <div class="login-left">

            <div class="logo">
                Clip<span>Mind AI</span>
            </div>

            <h1>AI Powered Video Intelligence</h1>

            <p>
                Upload videos, generate transcripts, summarize content,
                detect key moments and analyze your videos with AI.
            </p>

        </div>

        <!-- Right Side -->
        <div class="login-right">

            <div class="login-card fade">

                <h2>Welcome Back</h2>

                <p>Login to continue</p>

                <form id="loginForm">

                    <!-- Email -->

                    <div class="input-group">

                        <label>Email</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required>

                    </div>

                    <!-- Password -->

                    <div class="input-group">

                        <label>Password</label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required>

                    </div>

                    <!-- Remember -->

                    <div class="remember">

                        <label>

                            <input type="checkbox">

                            Remember Me

                        </label>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>

                    <!-- Button -->

                    <button
                        type="submit"
                        class="btn btn-primary login-btn">

                        <i class="fa-solid fa-right-to-bracket"></i>

                        Login

                    </button>

                </form>

                <div class="bottom-text">

                    Don't have an account?

                    <a href="register.html">

                        Register

                    </a>

                </div>

            </div>

        </div>

    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Scripts -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/login.js"></script>

</body>

</html>

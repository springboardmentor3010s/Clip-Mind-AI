<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Classrooms | ClipMind AI</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/sidebar.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/classrooms.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- Sidebar -->
    <div id="sidebar"></div>

    <!-- Main -->
    <div class="main">

        <!-- Navbar -->
        <div id="navbar"></div>

        <div class="page-container">

            <div class="page-header">

                <div>
                    <h1>My Classrooms</h1>
                    <p>Create and manage classrooms.</p>
                </div>

                <button id="createBtn" class="btn btn-primary">
                    <i class="fa-solid fa-plus"></i>
                    Create Classroom
                </button>

            </div>

            <!-- Create Classroom -->

            <div class="card">

                <form id="classroomForm">

                    <div class="form-group">

                        <label>Classroom Name</label>

                        <input
                            type="text"
                            id="classroomName"
                            placeholder="Enter classroom name"
                            required>

                    </div>

                    <button type="submit" class="btn btn-success">
                        Create
                    </button>

                </form>

            </div>

            <!-- Classroom Table -->

            <div class="table-card">

                <table>

                    <thead>

                        <tr>

                            <th>Classroom</th>
                            <th>Code</th>
                            <th>Learners</th>
                            <th>Lectures</th>
                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="classroomTable">

                        <tr>

                            <td colspan="5" style="text-align:center;">
                                Loading...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- JS -->

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/sidebar.js"></script>
    <script src="../assets/js/navbar.js"></script>
    <script src="../assets/js/classrooms.js"></script>

</body>

</html>

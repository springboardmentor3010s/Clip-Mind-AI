<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClipMind AI - Watch Video</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/watch-video.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div id="sidebar"></div>

    <main class="main-content">

        <div id="navbar"></div>

        <section class="watch-container">

            <div class="video-section">

                <video
                    id="videoPlayer"
                    controls
                    width="100%">
                </video>

            </div>

            <div class="video-details">

                <h2 id="videoTitle">Loading...</h2>

                <p id="videoDescription"></p>

                <div class="action-buttons">

                    <button
                        class="btn bookmark-btn"
                        onclick="bookmarkVideo()">

                        <i class="fa-solid fa-bookmark"></i>

                        Bookmark

                    </button>

                </div>

            </div>

            <div class="info-grid">

                <div class="card">

                    <h3>Transcript</h3>

                    <p id="transcript">
                        Loading transcript...
                    </p>

                </div>

                <div class="card">

                    <h3>AI Summary</h3>

                    <p id="summary">
                        Loading summary...
                    </p>

                </div>

                <div class="card">

                    <h3>Key Moments</h3>

                    <ul id="keyMoments"></ul>

                </div>

            </div>

        </section>

    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/sidebar.js"></script>
    <script src="../assets/js/navbar.js"></script>
    <script src="../assets/js/watch-video.js"></script>

</body>

</html>
